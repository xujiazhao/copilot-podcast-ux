<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Copilot Podcast</title>
  <!-- Load playlist data -->
  <script src="podcast-data.js"></script>
  <script src="article-content.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            foreground: {
              100: 'var(--foreground-100)',
              200: 'var(--foreground-200)',
              250: 'var(--foreground-250)',
              300: 'var(--foreground-300)',
              450: 'var(--foreground-450)',
              550: 'var(--foreground-550)',
              600: 'var(--foreground-600)',
              700: 'var(--foreground-700)',
              800: 'var(--foreground-800)',
              900: 'var(--foreground-900)',
            },
            background: {
              100: 'var(--background-100)',
              150: 'var(--background-150)',
              200: 'var(--background-200)',
              250: 'var(--background-250)',
              300: 'var(--background-300)',
            },
            accent: {
              200: 'var(--accent-200)',
              250: 'var(--accent-250)',
              300: 'var(--accent-300)',
              400: 'var(--accent-400)',
              500: 'var(--accent-500)',
              550: 'var(--accent-550)',
              600: 'var(--accent-600)',
            },
            muted: {
              200: 'var(--muted-200)',
              300: 'var(--muted-300)',
            },
            stroke: {
              300: 'var(--stroke-300)',
              450: 'var(--stroke-450)',
            },
          },
          borderRadius: {
            '3xl': '1.25rem',
            '4xl': '1.5rem',
            '5xl': '1.75rem',
            '6xl': '2rem',
          },
        },
      },
    }
  </script>
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="podcast-mobile.css">
  <style>
    /* Any page-specific overrides can go here */
    
    /* Fallback for missing podcast images - SVG waveform icon */
    .podcast-img-container {
      position: relative;
      background: linear-gradient(135deg, var(--accent-200, #e8d5c4), var(--accent-300, #d4b896));
    }
    .podcast-img-container img[src=""] {
      display: none;
    }
    .podcast-img-container img:not([src=""]) {
      position: relative;
      z-index: 1;
    }
    .podcast-img-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c08a50;
    }
    .podcast-img-fallback svg {
      width: 28px;
      height: 28px;
      opacity: 0.4;
    }

    /* Source expand/collapse animation */
    .source-item {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
      max-height: 80px;
      opacity: 1;
    }
    .source-item.source-collapsed {
      max-height: 0;
      opacity: 0;
      margin-top: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }
    .view-all-sources svg {
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body class="text-foreground-800 min-h-screen no-scroll">
  
  <!-- Welcome Page -->
  <div id="welcomePage" class="welcome-page">
    <div class="flex-1 flex flex-col px-6 safe-top">
      
      <!-- Header & Welcome - Centered -->
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <!-- Logo -->
        <div class="mb-4">
          <div class="w-24 h-24 rounded-2xl overflow-hidden flex items-center justify-center mx-auto">
            <img src="assets/Microsoft_Copilot_Icon.svg.png" alt="Copilot" class="w-full h-full object-cover">
          </div>
        </div>
        
        <!-- Title -->
        <h1 class="text-3xl font-semibold text-foreground-800 mb-2">Copilot Podcast</h1>

        <!-- Welcome Message -->
        <div class="mb-8">
          <p id="currentDate" class="text-foreground-800 text-xs"></p>
        </div>

        <!-- Today's Topics -->
        <div class="w-full max-w-sm">
          <h3 class="text-sm-medium text-foreground-600 mb-4">Here's what we will cover today</h3>
          
          <div id="topicTags" class="flex flex-wrap gap-2 justify-center">
            <!-- Topics will be populated from API data -->
            <span class="topic-tag px-3 py-1.5 rounded-xl text-xs font-semibold" style="animation-delay: 0.1s; background-color: rgba(224, 158, 102, 0.3); color: #6B3900;">Loading topics...</span>
          </div>
        </div>
      </div>

      <!-- Start Button -->
      <div class="w-full max-w-sm mx-auto mt-8 mb-6">
        <button id="startBtn" class="w-full py-4 rounded-4xl bg-foreground-800 text-white text-base-medium shadow-sm hover:shadow-md active:scale-95 flex items-center justify-center gap-2 transition-all">

            <rect x="120" y="80" width="40" height="352" rx="20"/>
            <rect x="200" y="16" width="40" height="480" rx="20"/>
            <rect x="280" y="112" width="40" height="288" rx="20"/>
            <rect x="360" y="64" width="40" height="384" rx="20"/>

      <!-- Bottom Navigation Bar -->

            </svg>
          </div>

            <!-- Home -->

              </svg>
            </div>
            
            <!-- Compass / Discover -->

              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"/>
              </svg>
            </div>

                <rect x="120" y="80" width="40" height="352" rx="20"/>
                <rect x="200" y="16" width="40" height="480" rx="20"/>
                <rect x="280" y="112" width="40" height="288" rx="20"/>
                <rect x="360" y="64" width="40" height="384" rx="20"/>

  <!-- Main App Container -->

      </div>

    </section>

    <!-- Now Playing Section (Queue Item Style) -->

          <span class="wave-bar w-[3px] bg-accent-500 rounded-full"></span>
          <span class="wave-bar w-[3px] bg-accent-500 rounded-full"></span>

        </div>

                <span>•</span>
                <span id="playerDuration"></span>

          </div>
        </div>
      </div>
    </section>

    <!-- Feed Section -->

  <!-- Fixed Bottom Control Bar (outside mainApp for proper fixed positioning) -->

        </div>
        <div class="flex-1 min-w-0">
          <p id="miniTitle" class="text-sm-medium text-foreground-800 line-clamp-1"></p>
          <p id="miniCategory" class="text-2xs text-foreground-800"></p>
        </div>
      </div>

      </div>

            <path d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/>

        <div class="px-4 py-3 flex items-center gap-3">

          </div>

      </header>

      <!-- Article Content -->
      <article class="article-content px-4 pb-60">
        <!-- Article Title -->
        <h1 id="articleTitle" class="text-xl-medium text-foreground-800 mt-6 mb-4"></h1>

        <!-- Article Body -->
        <div id="articleBody" class="article-body text-base text-foreground-700 leading-relaxed">
          <!-- Content will be inserted by JS -->
        </div>
      </article>
    </div>
  </div>

  <script>
    // Welcome page transition
    const welcomePage = document.getElementById('welcomePage');
    const mainApp = document.getElementById('mainApp');
    const startBtn = document.getElementById('startBtn');

    const controlBar = document.getElementById('controlBar');
    
    startBtn.addEventListener('click', () => {
      // Step 1: Fade out welcome page content
      welcomePage.classList.add('fading');
      
      // Enable scrolling for main app
      document.body.classList.remove('no-scroll');
      
      // Step 2: After fade out, hide welcome and show main app
      setTimeout(() => {
        welcomePage.classList.add('hidden');
        
        // Step 3: Show main app with slide-in animation
        setTimeout(() => {
          mainApp.classList.add('visible');
          controlBar.classList.add('visible');
          
          // Scroll to top to show Now Playing card
          setTimeout(() => {
            const mainContent = document.querySelector('#mainApp main');
            if (mainContent) {
              mainContent.scrollTop = 0;
            }
            window.scrollTo(0, 0);
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
            
            // Auto-play first episode after UI is ready
            setTimeout(() => {
              if (window.audioController && window.playerController) {
                window.audioController.loadEpisode(window.playerController.currentEpisode);
                window.audioController.play();
              }
            }, 200);
          }, 50);
        }, 100);
      }, 500);
    });

    // Add animation delays to topic tags
    document.querySelectorAll('.topic-tag').forEach((tag, index) => {
      tag.style.animationDelay = `${0.1 + index * 0.1}s`;
    });

    // Populate welcome page topics from API data
    podcastDataReady.then(() => {
      const topicContainer = document.getElementById('topicTags');
      if (!topicContainer || PODCAST_PLAYLIST.length === 0) return;
      
      // Category emoji mapping
      const categoryEmoji = {
        'World News': '🌍', 'News': '📰', 'Politics': '🏛️', 'Finance': '📈',
        'Sports': '⚽', 'Entertainment': '🎬', 'Health': '🏥', 'Technology': '🤖',
        'Lifestyle': '🌿', 'Travel': '✈️', 'Autos': '🚗', 'Culture': '📚'
      };
      
      // Get first 7 topics from playlist
      const topics = PODCAST_PLAYLIST.slice(0, 7);
      topicContainer.innerHTML = topics.map((ep, i) => {
        const emoji = categoryEmoji[ep.category] || '📌';
        // Extract 2 key words from title
        const words = ep.title.replace(/[''"",:;\-—–\$%]/g, '').split(/\s+/).filter(w => w.length > 2);
        const shortTitle = words.slice(0, 2).join(' ');
        return `<span class="topic-tag px-3 py-1.5 rounded-xl text-xs font-semibold" style="animation-delay: ${0.1 + i * 0.1}s; background-color: rgba(224, 158, 102, 0.3); color: #6B3900;">${emoji} ${shortTitle}</span>`;
      }).join('');
    });

    // Update current date display
    function updateCurrentDate() {
      const now = new Date();
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                      'July', 'August', 'September', 'October', 'November', 'December'];
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      
      const month = months[now.getMonth()];
      const day = now.getDate();
      const year = now.getFullYear();
      const weekday = days[now.getDay()];
      
      document.getElementById('currentDate').textContent = `${month} ${day}, ${year} • ${weekday}`;
    }
    updateCurrentDate();

    // Close button - return to welcome page
    document.getElementById('closeAppBtn')?.addEventListener('click', () => {
      // Stop audio playback
      if (window.audioController) {
        window.audioController.pause();
      }
      
      // Step 1: Fade out main app
      mainApp.classList.remove('visible');
      controlBar.classList.remove('visible');
      
      // Disable scrolling for welcome page
      document.body.classList.add('no-scroll');
      
      // Step 2: After fade out, show welcome page
      setTimeout(() => {
        welcomePage.classList.remove('hidden');
        
        // Step 3: Fade in welcome page
        setTimeout(() => {
          welcomePage.classList.remove('fading');
        }, 50);
      }, 500);
    });
  </script>

        this.playerContent = document.getElementById('playerContent');
        this.playerTitle = document.getElementById('playerTitle');
        this.playerDuration = document.getElementById('playerDuration');
        this.playerCategory = document.getElementById('playerCategory');
        this.playerThumbnail = document.getElementById('playerThumbnail');
        this.playerSources = document.getElementById('playerSources');
        this.completedSection = document.getElementById('completedSection');
        this.completedList = document.getElementById('completedList');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.feedList = document.getElementById('feedList');

        this.bindEvents();
        this.initializePlayer();
      }

      initializePlayer() {
        // Initialize player UI from external data
        const episode = PODCAST_PLAYLIST[0];
        this.playerTitle.textContent = episode.title;
        this.playerDuration.textContent = episode.duration;
        this.playerCategory.textContent = episode.category;
        
        // Update thumbnail
        const thumbnailDiv = this.playerThumbnail;
        thumbnailDiv.className = `flex-shrink-0 w-[70px] h-[70px] rounded-xl bg-background-200 overflow-hidden shadow-sm podcast-img-container`;
        thumbnailDiv.innerHTML = `<div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>${episode.image ? `<img src="${episode.image}" alt="${episode.category}" class="w-full h-full object-cover">` : ''}`;
        
        // Update mini player in control bar
        this.updateMiniPlayer(episode);
        
        // Update total time in control bar
        const totalTimeEl = document.getElementById('totalTime');
        if (totalTimeEl) totalTimeEl.textContent = episode.duration;
        
        // Update sources section
        this.updateSourcesUI(episode);
      }
      
      updateMiniPlayer(episode) {
        const miniThumbnail = document.getElementById('miniThumbnail');
        const miniTitle = document.getElementById('miniTitle');
        const miniCategory = document.getElementById('miniCategory');
        
        if (miniThumbnail) {
          miniThumbnail.className = `w-10 h-10 rounded-lg bg-gray-200 overflow-hidden flex-shrink-0 shadow-sm podcast-img-container`;
          const miniSrc = episode.thumbnail || episode.image;
          miniThumbnail.innerHTML = `<div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>${miniSrc ? `<img src="${miniSrc}" alt="" class="w-full h-full object-cover">` : ''}`;
        }
        if (miniTitle) miniTitle.textContent = episode.title;
        if (miniCategory) miniCategory.textContent = `${episode.category} • ${episode.duration}`;
      }

      updateSourcesUI(episode) {
        this._renderSources(episode.sources || 0, episode.detailedSources || [], episode.id);
      }

      _renderSources(sourceCount, detailedSources, episodeId) {
        const maxVisible = 3;
        const allSources = detailedSources.slice(0, sourceCount);
        const hasMore = allSources.length > maxVisible;
        
        let sourcesHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="text-sm text-foreground-600">${sourceCount} sources</span>
          </div>
          <div class="space-y-2 sources-list">
        `;
        
        allSources.forEach((source, index) => {
          const logoPath = source.logo || this.publisherLogos[source.name] || 'publisher icon/Ramdom1.png';
          const articleData = encodeURIComponent(JSON.stringify({
            title: source.article,
            publisher: source.name,
            logo: logoPath,
            time: source.time,
            episodeId: episodeId,
            sourceIndex: index
          }));
          const hiddenClass = (hasMore && index >= maxVisible) ? ' source-collapsed' : '';
          sourcesHTML += `
            <div class="source-item flex items-center gap-2 p-2 rounded-xl bg-background-150${hiddenClass}" data-article="${articleData}">
              <img src="${logoPath}" alt="${source.name}" class="w-4 h-4 rounded flex-shrink-0 object-contain">
              <div class="flex-1 min-w-0">
                <p class="text-sm text-foreground-700 line-clamp-1" style="font-weight: 400;">${source.article}</p>
                <p class="text-2xs text-foreground-450">${source.name} • ${source.time}</p>
              </div>
              <svg class="w-3 h-3 text-foreground-800 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          `;
        });
        
        sourcesHTML += '</div>';
        
        if (hasMore) {
          sourcesHTML += `
            <button class="view-all-sources w-full mt-2 py-2 text-xs text-accent-550 flex items-center justify-center gap-1 rounded-xl hover:bg-background-150 transition-colors">
              <span>View all ${sourceCount} sources</span>
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
          `;
        }
        
        this.playerSources.innerHTML = sourcesHTML;
        
        // Bind view-all toggle
        const viewAllBtn = this.playerSources.querySelector('.view-all-sources');
        if (viewAllBtn) {
          viewAllBtn.addEventListener('click', () => {
            const collapsedItems = this.playerSources.querySelectorAll('.source-item.source-collapsed');
            if (collapsedItems.length > 0) {
              // Expand: stagger each item
              collapsedItems.forEach((el, i) => {
                setTimeout(() => el.classList.remove('source-collapsed'), i * 60);
              });
              viewAllBtn.querySelector('span').textContent = 'Show less';
              viewAllBtn.querySelector('svg').style.transform = 'rotate(180deg)';
            } else {
              // Collapse: reverse stagger
              const allItems = Array.from(this.playerSources.querySelectorAll('.source-item'));
              const toCollapse = allItems.filter((_, idx) => idx >= maxVisible).reverse();
              toCollapse.forEach((el, i) => {
                setTimeout(() => el.classList.add('source-collapsed'), i * 40);
              });
              viewAllBtn.querySelector('span').textContent = `View all ${sourceCount} sources`;
              viewAllBtn.querySelector('svg').style.transform = '';
            }
          });
        }
        
        // Add click handlers for source items
        this.playerSources.querySelectorAll('.source-item').forEach(item => {
          item.addEventListener('click', () => {
            const articleData = JSON.parse(decodeURIComponent(item.dataset.article));
            if (window.articleController) {
              window.articleController.openArticle(articleData);
            }
          });
        });
      }

      bindEvents() {
        this.prevBtn.addEventListener('click', (e) => {
          if (this.prevBtn.classList.contains('btn-disabled')) return;
          this.temporarilyDisableButtons();
          this.playPrevious();
        });
        this.nextBtn.addEventListener('click', (e) => {
          if (this.nextBtn.classList.contains('btn-disabled')) return;
          this.temporarilyDisableButtons();
          this.playNext();
        });
        
        // Toggle completed list expansion
        const toggleBtn = document.getElementById('toggleCompletedBtn');
        toggleBtn.addEventListener('click', () => this.toggleCompletedList());
      }
      
      // Disable buttons for a fixed duration to prevent rapid clicking
      temporarilyDisableButtons() {
        this.prevBtn.classList.add('btn-disabled');
        this.nextBtn.classList.add('btn-disabled');
        this.prevBtn.style.pointerEvents = 'none';
        this.nextBtn.style.pointerEvents = 'none';
        this.prevBtn.style.opacity = '0.5';
        this.nextBtn.style.opacity = '0.5';
        
        setTimeout(() => {
          this.prevBtn.classList.remove('btn-disabled');
          this.nextBtn.classList.remove('btn-disabled');
          this.prevBtn.style.pointerEvents = '';
          this.nextBtn.style.pointerEvents = '';
          this.prevBtn.style.opacity = '';
          this.nextBtn.style.opacity = '';
        }, 600);
      }

      getNextFromFeed() {
        const feedItem = this.feedList.querySelector('.feed-item');
        if (!feedItem) return null;

        // Try to find the episode in PODCAST_PLAYLIST by ID
        const episodeId = parseInt(feedItem.dataset.id);
        const playlistEpisode = PODCAST_PLAYLIST.find(ep => ep.id === episodeId);
        
        if (playlistEpisode) {
          // Return full data from playlist including detailedSources
          return {
            ...playlistEpisode,
            thumbnail: playlistEpisode.image,
            element: feedItem
          };
        }

        // Fallback to extracting from DOM if not found in playlist
        const article = feedItem.querySelector('article');
        const title = article.querySelector('h4')?.textContent || '';
        const category = article.querySelector('.text-2xs')?.textContent || '';
        const spans = article.querySelectorAll('.flex.items-center.gap-2 span');
        let duration = '5:00';
        // Find duration (format like "5:18")
        spans.forEach(span => {
          if (/^\d+:\d+$/.test(span.textContent)) {
            duration = span.textContent;
          }
        });
        const img = article.querySelector('img');
        const thumbnail = img?.src || '';
        const sources = parseInt(feedItem.dataset.sources) || 0;
        const sourceNames = feedItem.dataset.sourceNames || '';

        return {
          id: Date.now(),
          title,
          duration,
          category,
          thumbnail,
          sources,
          sourceNames,
          detailedSources: [],
          element: feedItem
        };
      }

      playNext() {
        const nextEpisode = this.getNextFromFeed();
        if (!nextEpisode) return;

        // Add current to completed
        this.addToCompleted(this.currentEpisode);

        // Remove from feed with fade out animation
        const feedItem = nextEpisode.element;
        feedItem.style.transition = 'opacity 0.25s ease, max-height 0.3s ease, margin 0.3s ease, padding 0.3s ease';
        feedItem.style.opacity = '0';
        setTimeout(() => {
          feedItem.style.maxHeight = '0';
          feedItem.style.marginBottom = '0';
          feedItem.style.overflow = 'hidden';
          setTimeout(() => feedItem.remove(), 300);
        }, 250);

        // Switch animation
        this.playerContent.classList.add('switching');
        
        setTimeout(() => {
          // Update current
          this.currentEpisode = nextEpisode;
          this.updatePlayer();
          this.playerContent.classList.remove('switching');
          
          // Auto-play the new episode
          if (window.audioController) {
            window.audioController.loadEpisode(this.currentEpisode);
            window.audioController.play();
          }
        }, 200);

        // Update prev button state
        this.updateButtonStates();
        
        // Check if we need to load more episodes (when remaining items < 3)
        this.checkAndLoadMore();
      }
      
      checkAndLoadMore() {
        const remainingItems = this.feedList.querySelectorAll('.feed-item').length;
        // Load more when less than 3 items remain in the queue
        if (remainingItems <= 3 && window.infiniteScroll && !window.infiniteScroll.isLoading) {
          window.infiniteScroll.loadMore();
        }
      }

      playPrevious() {
        if (this.completedEpisodes.length === 0) return;

        // Get last completed episode
        const prevEpisode = this.completedEpisodes.pop();
        
        // Put current back to feed (at the top)
        this.addToFeedTop(this.currentEpisode);

        // Remove from completed list
        const completedItems = this.completedList.querySelectorAll('.completed-item');
        if (completedItems.length > 0) {
          const lastItem = completedItems[completedItems.length - 1];
          lastItem.style.opacity = '0';
          lastItem.style.transform = 'translateY(-10px)';
          setTimeout(() => lastItem.remove(), 200);
        }

        // Switch animation
        this.playerContent.classList.add('switching');
        
        setTimeout(() => {
          this.currentEpisode = prevEpisode;
          this.updatePlayer();
          this.playerContent.classList.remove('switching');
          
          // Auto-play the previous episode
          if (window.audioController) {
            window.audioController.loadEpisode(this.currentEpisode);
            window.audioController.play();
          }
        }, 200);

        // Update section visibility and button states
        this.updateCompletedVisibility();
        this.updateButtonStates();
      }

      addToCompleted(episode) {
        this.completedEpisodes.push(episode);

        const completedItem = document.createElement('div');
        completedItem.className = 'completed-item new-item flex items-center gap-3 p-2 bg-background-100 rounded-xl shadow-sm';
        completedItem.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-background-200 overflow-hidden flex-shrink-0 opacity-70 podcast-img-container">
            <div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>
            ${episode.thumbnail ? `<img src="${episode.thumbnail}" alt="" class="w-full h-full object-cover">` : ''}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs text-foreground-600 line-clamp-1">${episode.title}</p>
          </div>
        `;

        // Add click handler to play this episode again
        completedItem.addEventListener('click', () => this.playFromCompleted(episode, completedItem));

        this.completedList.appendChild(completedItem);
        this.updateCompletedVisibility();
      }

      addToFeedTop(episode) {
        const feedItem = document.createElement('div');
        feedItem.className = 'feed-item swipe-container';
        feedItem.dataset.id = episode.id;
        feedItem.dataset.sources = episode.sources || 0;
        feedItem.dataset.sourceNames = episode.sourceNames || '';
        feedItem.innerHTML = `
          <div class="swipe-delete-bg">
            <div class="swipe-hint">
              <span>Not interested</span>
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </div>
          </div>
          <article class="swipe-content flex gap-3 p-3 rounded-2xl shadow-sm">
            <div class="flex-shrink-0 w-[70px] h-[70px] rounded-xl bg-background-200 overflow-hidden podcast-img-container">
              <div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>
              ${episode.thumbnail ? `<img src="${episode.thumbnail}" alt="" class="w-full h-full object-cover opacity-85">` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm-medium text-foreground-800 line-clamp-2 mb-1">${episode.title}</h4>
              <div class="flex items-center gap-2 text-xs text-foreground-450">
                <span class="px-1.5 py-0.5 rounded bg-muted-200 text-foreground-550 text-2xs">${episode.category}</span>
                <span>${episode.duration}</span>
                <span>•</span>
                <span>${episode.sources || 3} sources</span>
              </div>
            </div>
          </article>
        `;

        // Insert at top of feed
        this.feedList.insertBefore(feedItem, this.feedList.firstChild);
        
        // Initialize swipe for this new item
        new SwipeToDelete(feedItem);
        
        // Add click handler to play this episode
        this.addFeedItemClickHandler(feedItem);
      }

      updatePlayer() {
        this.playerTitle.textContent = this.currentEpisode.title;
        this.playerDuration.textContent = this.currentEpisode.duration;
        this.playerCategory.textContent = this.currentEpisode.category;
        
        // Update thumbnail
        this.playerThumbnail.className = `flex-shrink-0 w-[70px] h-[70px] rounded-xl bg-background-200 overflow-hidden shadow-sm podcast-img-container`;
        const thumbSrc = this.currentEpisode.thumbnail || this.currentEpisode.image;
        this.playerThumbnail.innerHTML = `<div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>${thumbSrc ? `<img src="${thumbSrc}" alt="" class="w-full h-full object-cover">` : ''}`;

        // Update mini player in control bar
        this.updateMiniPlayer(this.currentEpisode);

        // Reset progress bar (update both in control bar)
        const progressBars = document.querySelectorAll('.audio-progress');
        progressBars.forEach(bar => {
          bar.value = 0;
          if (typeof updateProgressBar === 'function') {
            updateProgressBar(bar);
          }
        });
        const currentTimeEl = document.getElementById('currentTime');
        if (currentTimeEl) currentTimeEl.textContent = '0:00';
        const totalTimeEl = document.getElementById('totalTime');
        if (totalTimeEl) totalTimeEl.textContent = this.currentEpisode.duration;

        // Update sources section
        this.updateSources();
      }

      updateSources() {
        this._renderSources(
          this.currentEpisode.sources || 0,
          this.currentEpisode.detailedSources || [],
          this.currentEpisode.id
        );
      }

      updateCompletedVisibility() {
        const toggleBtn = document.getElementById('toggleCompletedBtn');
        const itemCount = this.completedEpisodes.length;
        
        if (itemCount > 0) {
          this.completedSection.classList.add('has-items');
        } else {
          this.completedSection.classList.remove('has-items');
        }
        
        // Show/hide toggle button when more than 3 items
        if (itemCount > 3) {
          toggleBtn.classList.remove('hidden');
          const isExpanded = !this.completedList.classList.contains('completed-collapsed');
          toggleBtn.textContent = isExpanded ? 'Show less' : `Show all (${itemCount})`;
        } else {
          toggleBtn.classList.add('hidden');
          this.completedList.classList.add('completed-collapsed');
        }
      }
      
      toggleCompletedList() {
        const toggleBtn = document.getElementById('toggleCompletedBtn');
        const isCollapsed = this.completedList.classList.contains('completed-collapsed');
        
        if (isCollapsed) {
          this.completedList.classList.remove('completed-collapsed');
          toggleBtn.textContent = 'Show less';
        } else {
          this.completedList.classList.add('completed-collapsed');
          toggleBtn.textContent = `Show all (${this.completedEpisodes.length})`;
        }
      }

      updateButtonStates() {
        this.prevBtn.disabled = this.completedEpisodes.length === 0;
        this.nextBtn.disabled = !this.feedList.querySelector('.feed-item');
      }

      // Add click handler to a feed item
      addFeedItemClickHandler(feedItem) {
        const article = feedItem.querySelector('article');
        if (article) {
          article.addEventListener('click', (e) => {
            // Don't trigger if swiping
            if (feedItem.querySelector('.swipe-content.swiping')) return;
            this.playFromFeed(feedItem);
          });
        }
      }

      // Extract episode data from a feed item element
      extractEpisodeFromFeedItem(feedItem) {
        // Try to find the episode in PODCAST_PLAYLIST by ID
        const episodeId = parseInt(feedItem.dataset.id);
        const playlistEpisode = PODCAST_PLAYLIST.find(ep => ep.id === episodeId);
        
        if (playlistEpisode) {
          // Return full data from playlist including detailedSources
          return {
            ...playlistEpisode,
            thumbnail: playlistEpisode.image,
            element: feedItem
          };
        }
        
        // Fallback to extracting from DOM if not found in playlist
        const article = feedItem.querySelector('article');
        const title = article.querySelector('h4')?.textContent || '';
        const category = article.querySelector('.text-2xs')?.textContent || '';
        const spans = article.querySelectorAll('.flex.items-center.gap-2 span');
        let duration = '5:00';
        spans.forEach(span => {
          if (/^\d+:\d+$/.test(span.textContent)) {
            duration = span.textContent;
          }
        });
        const img = article.querySelector('img');
        const thumbnail = img?.src || '';
        const sources = parseInt(feedItem.dataset.sources) || 0;
        const sourceNames = feedItem.dataset.sourceNames || '';

        return {
          id: Date.now(),
          title,
          duration,
          category,
          thumbnail,
          sources,
          sourceNames,
          detailedSources: [],
          element: feedItem
        };
      }

      // Play a specific episode from the feed (clicked by user)
      playFromFeed(feedItem) {
        // Prevent double-clicks
        if (feedItem.classList.contains('removing')) return;
        feedItem.classList.add('removing');
        
        const episode = this.extractEpisodeFromFeedItem(feedItem);
        if (!episode) return;

        // Add current to completed
        this.addToCompleted(this.currentEpisode);

        // Remove clicked item from feed with animation
        feedItem.style.transition = 'opacity 0.25s ease, max-height 0.3s ease, margin 0.3s ease';
        feedItem.style.opacity = '0';
        setTimeout(() => {
          feedItem.style.maxHeight = '0';
          feedItem.style.marginBottom = '0';
          feedItem.style.overflow = 'hidden';
          setTimeout(() => feedItem.remove(), 300);
        }, 250);

        // Switch animation
        this.playerContent.classList.add('switching');
        
        setTimeout(() => {
          this.currentEpisode = episode;
          this.updatePlayer();
          this.playerContent.classList.remove('switching');
          
          // Auto-play the selected episode
          if (window.audioController) {
            window.audioController.loadEpisode(this.currentEpisode);
            window.audioController.play();
          }
        }, 200);

        this.updateButtonStates();
      }

      // Play a specific episode from completed list (replay)
      playFromCompleted(episode, completedItemElement) {
        // Prevent double-clicks
        if (completedItemElement.classList.contains('removing')) return;
        completedItemElement.classList.add('removing');

        // Remove the clicked episode from completedEpisodes array first
        const index = this.completedEpisodes.findIndex(ep => ep.id === episode.id || ep.title === episode.title);
        if (index !== -1) {
          this.completedEpisodes.splice(index, 1);
        }

        // Use requestAnimationFrame for smoother animation
        requestAnimationFrame(() => {
          // Animate out the clicked item
          completedItemElement.style.transition = 'opacity 0.15s ease-out, transform 0.15s ease-out';
          completedItemElement.style.opacity = '0';
          completedItemElement.style.transform = 'translateX(-20px)';
          
          // Start player switch animation simultaneously
          this.playerContent.classList.add('switching');
        });

        // After animations complete, update state
        setTimeout(() => {
          // Remove element from DOM
          completedItemElement.remove();
          
          // Add current episode to completed
          this.addToCompleted(this.currentEpisode);
          
          // Update current episode and player
          this.currentEpisode = episode;
          this.updatePlayer();
          this.playerContent.classList.remove('switching');
          
          // Auto-play the replayed episode
          if (window.audioController) {
            window.audioController.loadEpisode(this.currentEpisode);
            window.audioController.play();
          }
          
          this.updateCompletedVisibility();
          this.updateButtonStates();
        }, 150);
      }
    }

    // Initialize after DOM is ready and data is loaded
    document.addEventListener('DOMContentLoaded', () => {
      podcastDataReady.then(() => {
        window.playerController = new PlayerController();
      });
    });
  </script>

  <script>
    // Article Detail Page Controller
    class ArticleController {
      constructor() {
        this.articlePage = document.getElementById('articlePage');
        this.articleBackBtn = document.getElementById('articleBackBtn');
        this.articlePublisherLogo = document.getElementById('articlePublisherLogo');
        this.articlePublisherName = document.getElementById('articlePublisherName');
        this.articleMeta = document.getElementById('articleMeta');
        this.articleTitle = document.getElementById('articleTitle');
        this.articleBody = document.getElementById('articleBody');
        
        this.bindEvents();
      }
      
      bindEvents() {
        this.articleBackBtn.addEventListener('click', () => this.closeArticle());
        
        // Handle back gesture/button
        window.addEventListener('popstate', (e) => {
          if (this.articlePage.classList.contains('visible')) {
            e.preventDefault();
            this.closeArticle();
          }
        });
      }
      
      openArticle(data) {
        // Try to get specific article content from article-content.js
        let articleContent = null;
        let readTime = '5 min read';
        
        if (data.episodeId !== undefined && data.sourceIndex !== undefined) {
          articleContent = getArticleContent(data.episodeId, data.sourceIndex);
          if (articleContent) {
            readTime = articleContent.readTime;
          }
        }
        
        // Update publisher info in header
        this.articlePublisherLogo.src = data.logo;

  <script>
    // Swipe to Delete Functionality
    class SwipeToDelete {
      constructor(container) {
        this.container = container;
        this.content = container.querySelector('.swipe-content');
        this.deleteBg = container.querySelector('.swipe-delete-bg');
        this.startX = 0;
        this.currentX = 0;
        this.isDragging = false;
        this.threshold = 100; // Minimum swipe distance to trigger delete
        this.maxSwipe = 150; // Maximum swipe distance
        
        this.bindEvents();
      }

      bindEvents() {
        // Touch events
        this.content.addEventListener('touchstart', (e) => this.handleStart(e), { passive: true });
        this.content.addEventListener('touchmove', (e) => this.handleMove(e), { passive: false });
        this.content.addEventListener('touchend', (e) => this.handleEnd(e));
        
        // Mouse events for desktop testing
        this.content.addEventListener('mousedown', (e) => this.handleStart(e));
        document.addEventListener('mousemove', (e) => {
          if (this.isDragging) this.handleMove(e);
        });
        document.addEventListener('mouseup', (e) => {
          if (this.isDragging) this.handleEnd(e);
        });
      }

      handleStart(e) {
        this.isDragging = true;
        this.startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        this.content.classList.add('swiping');
      }

      handleMove(e) {
        if (!this.isDragging) return;
        
        const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        const diff = this.startX - clientX;
        
        // Only allow left swipe (positive diff)
        if (diff > 0) {
          e.preventDefault && e.preventDefault();
          this.currentX = Math.min(diff, this.maxSwipe);
          this.content.style.transform = `translateX(-${this.currentX}px)`;
          
          // Show/hide delete indicator based on threshold
          if (this.currentX >= this.threshold) {
            this.deleteBg.classList.add('active');
          } else {
            this.deleteBg.classList.remove('active');
          }
        }
      }

      handleEnd(e) {
        if (!this.isDragging) return;
        
        this.isDragging = false;
        this.content.classList.remove('swiping');
        
        if (this.currentX >= this.threshold) {
          // Delete the item
          this.deleteItem();
        } else {
          // Snap back
          this.content.style.transform = 'translateX(0)';
          this.deleteBg.classList.remove('active');
        }
        
        this.currentX = 0;
      }

      deleteItem() {
        // Show toast notification
        if (typeof showToast === 'function') {
          showToast('Updating playlist');
        }
        
        // Use requestAnimationFrame for smoother animation
        requestAnimationFrame(() => {
          // Animate out - both content and delete background simultaneously
          this.content.classList.add('removing');
          this.deleteBg.classList.add('hiding');
          
          // Wait for slide-out animation, then collapse
          setTimeout(() => {
            requestAnimationFrame(() => {
              this.container.classList.add('collapsed');
              
              // Remove from DOM after collapse animation
              setTimeout(() => {
                this.container.remove();
              }, 250);
            });
          }, 200);
        });
      }
    }

    // Swipe items are now initialized when they are rendered by InfiniteScroll
  </script>

  <script>
    // Infinite Scroll - uses data from podcast-data.js
    class InfiniteScroll {
      constructor() {
        this.feedList = document.getElementById('feedList');
        this.loadMoreIndicator = document.getElementById('loadMoreIndicator');
        this.mainContent = document.querySelector('main');
        this.batchIndex = 0;
        this.isLoading = false;
        this.initialBatchSize = 8;  // 首次加载8条
        this.batchSize = 6;         // 后续每次刷新6条
        
        // Render initial items (index 1-10, since 0 is currently playing)
        this.renderInitialItems();
        this.bindEvents();
      }
      
      renderInitialItems() {
        // Get initial batch (items 1-8 from PODCAST_PLAYLIST, since 0 is currently playing)
        const initialItems = PODCAST_PLAYLIST.slice(1, 1 + this.initialBatchSize);
        initialItems.forEach(item => {
          const feedItem = this.createFeedItem(item);
          this.feedList.appendChild(feedItem);
          // Initialize swipe
          new SwipeToDelete(feedItem);
          // Add click handler (wait for PlayerController to be ready)
          setTimeout(() => {
            if (window.playerController) {
              window.playerController.addFeedItemClickHandler(feedItem);
            }
          }, 100);
        });
      }
      
      getBatch(index) {
        // 首次加载8条后，后续每次加载6条
        const startIndex = 1 + this.initialBatchSize + (index * this.batchSize);
        const endIndex = startIndex + this.batchSize;
        return PODCAST_PLAYLIST.slice(startIndex, endIndex);
      }
      
      hasMoreItems() {
        const nextStartIndex = 1 + this.initialBatchSize + (this.batchIndex * this.batchSize);
        return nextStartIndex < PODCAST_PLAYLIST.length;
      }
      
      bindEvents() {
        // Use Intersection Observer for infinite scroll
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !this.isLoading && this.hasMoreItems()) {
            this.loadMore();
          }
        }, { threshold: 0.5 });
        
        observer.observe(this.loadMoreIndicator);
      }
      
      loadMore() {
        if (!this.hasMoreItems()) {
          this.loadMoreIndicator.innerHTML = '<span class="text-xs text-foreground-450">You are all caught up!</span>';
          return;
        }
        
        this.isLoading = true;
        
        // Simulate loading delay
        setTimeout(() => {
          const batch = this.getBatch(this.batchIndex);
          const fragment = document.createDocumentFragment();
          const items = [];
          
          batch.forEach((item) => {
            const feedItem = this.createFeedItem(item);
            feedItem.classList.add('loading-in');
            fragment.appendChild(feedItem);
            items.push(feedItem);
          });
          
          // Add all items at once to minimize reflows
          this.feedList.appendChild(fragment);
          
          // Force reflow, then animate in
          requestAnimationFrame(() => {
            items.forEach((feedItem, index) => {
              const delay = index * 30;
              setTimeout(() => {
                feedItem.classList.remove('loading-in');
                feedItem.classList.add('loaded');
                
                // Remove loaded class after animation to prevent transition conflicts
                setTimeout(() => {
                  feedItem.classList.remove('loaded');
                }, 250);
              }, delay);
              
              // Initialize swipe and click handler
              new SwipeToDelete(feedItem);
              if (window.playerController) {
                window.playerController.addFeedItemClickHandler(feedItem);
              }
            });
          });
          
          this.batchIndex++;
          this.isLoading = false;
          
          if (!this.hasMoreItems()) {
            this.loadMoreIndicator.innerHTML = '<span class="text-xs text-foreground-450">You are all caught up!</span>';
          }
        }, 800);
      }
      
      createFeedItem(item) {
        const div = document.createElement('div');
        div.className = 'feed-item swipe-container';
        div.dataset.id = item.id;
        div.dataset.sources = item.sources;
        div.dataset.sourceNames = item.sourceNames;
        div.innerHTML = `
          <div class="swipe-delete-bg">
            <div class="swipe-hint">
              <span>Not interested</span>
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </div>
          </div>
          <article class="swipe-content flex gap-3 p-3 rounded-2xl shadow-sm">
            <div class="flex-shrink-0 w-[70px] h-[70px] rounded-xl bg-background-200 overflow-hidden podcast-img-container">
              <div class="podcast-img-fallback"><svg fill="currentColor" viewBox="0 0 512 512"><rect x="40" y="160" width="40" height="192" rx="20"/><rect x="120" y="80" width="40" height="352" rx="20"/><rect x="200" y="16" width="40" height="480" rx="20"/><rect x="280" y="112" width="40" height="288" rx="20"/><rect x="360" y="64" width="40" height="384" rx="20"/><rect x="440" y="144" width="40" height="224" rx="20"/></svg></div>
              ${item.image ? `<img src="${item.image}" alt="${item.category}" class="w-full h-full object-cover opacity-85">` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm-medium text-foreground-800 line-clamp-2 mb-1">${item.title}</h4>
              <div class="flex items-center gap-2 text-xs text-foreground-450">
                <span class="px-1.5 py-0.5 rounded bg-muted-200 text-foreground-550 text-2xs">${item.category}</span>
                <span>${item.duration}</span>
                <span>•</span>
                <span>${item.sources} sources</span>
              </div>
            </div>
          </article>
        `;
        return div;
      }
    }
    
    // Initialize infinite scroll
    // Store infinite scroll instance globally
    window.infiniteScroll = null;
    
    document.addEventListener('DOMContentLoaded', () => {
      // Wait for podcast data to be loaded from API before initializing
      podcastDataReady.then(() => {
        window.infiniteScroll = new InfiniteScroll();
      });
    });
    
    // Fix: Re-initialize infinite scroll when main app becomes visible
    document.getElementById('startBtn')?.addEventListener('click', () => {
      // Wait for transition to complete
      setTimeout(() => {
        const mainContent = document.querySelector('#mainApp main');
        if (!mainContent) {
          console.error('Main content not found');
          return;
        }
        
        console.log('Setting up scroll listener');
        
        // Use scroll event listener (more reliable)
        mainContent.addEventListener('scroll', function handleScroll() {
          const scrollTop = mainContent.scrollTop;
          const scrollHeight = mainContent.scrollHeight;
          const clientHeight = mainContent.clientHeight;
          
          // If we're near the bottom (within 300px)
          if (scrollHeight - scrollTop - clientHeight < 300) {
            if (window.infiniteScroll && !window.infiniteScroll.isLoading && window.infiniteScroll.batchIndex < window.infiniteScroll.maxBatches) {
              console.log('Loading more content, batch:', window.infiniteScroll.batchIndex);
              window.infiniteScroll.loadMore();
            }
          }
        });
      }, 300);
    });
  </script>

  <script>
    // Progress bar styling - update gradient based on value
    function updateProgressBar(progressBar) {
      const value = progressBar.value;
      const max = progressBar.max || 100;
      const percentage = (value / max) * 100;
      progressBar.style.setProperty('--progress', percentage + '%');
    }

    // Initialize progress bars
    document.addEventListener('DOMContentLoaded', () => {
      const progressBars = document.querySelectorAll('.audio-progress');
      progressBars.forEach(bar => {

  <script>
    // Audio Playback Controller (Real Audio with Fallback)
    class AudioController {
      constructor() {
        this.isPlaying = false;
        this.currentTime = 0; // in seconds
        this.duration = 0; // in seconds
        this.playInterval = null;
        this.useRealAudio = false; // Whether current episode has real audio
        this.audio = new Audio(); // HTML5 Audio element for real audio playback
        
        // Elements
        this.playBtn = document.getElementById('playBtn');
        this.playIcon = document.getElementById('playIcon');
        this.progressBar = document.querySelector('.audio-progress');
        this.currentTimeEl = document.getElementById('currentTime');
        this.totalTimeEl = document.getElementById('totalTime');
        
        this.bindEvents();
        this.bindAudioEvents();
      }
      
      bindEvents() {
        // Play/Pause button
        this.playBtn.addEventListener('click', () => this.togglePlay());
        
        // Progress bar seeking
        this.progressBar.addEventListener('input', (e) => {
          const percentage = e.target.value / 100;
          this.currentTime = this.duration * percentage;
          if (this.useRealAudio) {
            this.audio.currentTime = this.currentTime;
          }
          this.updateTimeDisplay();
        });
        
        // Progress bar - pause while seeking, resume after
        this.progressBar.addEventListener('mousedown', () => {
          if (this.isPlaying) {
            this.wasPlayingBeforeSeek = true;
            this.pause();
          }
        });
        
        this.progressBar.addEventListener('mouseup', () => {
          if (this.wasPlayingBeforeSeek) {
            this.wasPlayingBeforeSeek = false;
            this.play();
          }
        });
        
        this.progressBar.addEventListener('touchstart', () => {
          if (this.isPlaying) {
            this.wasPlayingBeforeSeek = true;
            this.pause();
          }
        });
        
        this.progressBar.addEventListener('touchend', () => {
          if (this.wasPlayingBeforeSeek) {
            this.wasPlayingBeforeSeek = false;
            this.play();
          }
        });
      }
      
      // Bind HTML5 Audio events for real audio playback
      bindAudioEvents() {
        this.audio.addEventListener('timeupdate', () => {
          if (this.useRealAudio && this.isPlaying) {
            this.currentTime = this.audio.currentTime;
            this.updateUI();
          }
        });
        
        this.audio.addEventListener('loadedmetadata', () => {
          if (this.useRealAudio) {
            this.duration = this.audio.duration;
            this.updateUI();
            // Update duration display in player UI to match actual audio length
            this.updateDurationDisplays();
          }
        });
        
        this.audio.addEventListener('ended', () => {
          if (this.useRealAudio) {
            this.onEpisodeEnd();
          }
        });
        
        this.audio.addEventListener('error', (e) => {
          console.error('Audio playback error:', e);
          // Fallback to simulated mode if real audio fails
          this.useRealAudio = false;
        });
      }
      
      // Update all duration displays to show actual audio length
      updateDurationDisplays() {
        const formattedDuration = this.formatTime(this.duration);
        
        // Update playerDuration (next to category in main player)
        const playerDuration = document.getElementById('playerDuration');
        if (playerDuration) playerDuration.textContent = formattedDuration;
        
        // Update mini player category text (format: "Category • Duration")
        const miniCategory = document.getElementById('miniCategory');
        if (miniCategory && window.playerController) {
          const category = window.playerController.currentEpisode.category;
          miniCategory.textContent = `${category} • ${formattedDuration}`;
        }
      }
      
      // Parse duration string "M:SS" to seconds
      parseDuration(durationStr) {
        const parts = durationStr.split(':');
        const minutes = parseInt(parts[0], 10);
        const seconds = parseInt(parts[1], 10);
        return minutes * 60 + seconds;
      }
      
      // Format seconds to "M:SS"
      formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      }
      
      // Load a new episode (accepts episode object with audioSrc, or just duration string for backward compatibility)
      loadEpisode(episodeOrDuration) {
        this.pause();
        this.currentTime = 0;
        
        // Check if we received an episode object or just a duration string
        if (typeof episodeOrDuration === 'object' && episodeOrDuration.audioSrc) {
          // Real audio mode
          this.useRealAudio = true;
          this.audio.src = episodeOrDuration.audioSrc;
          this.audio.load();
          this.duration = this.parseDuration(episodeOrDuration.duration);
        } else {
          // Simulated mode (no real audio file)
          this.useRealAudio = false;
          const durationStr = typeof episodeOrDuration === 'object' ? episodeOrDuration.duration : episodeOrDuration;
          this.duration = this.parseDuration(durationStr);
        }
        
        this.updateUI();
      }
      
      // Start playback
      play() {
        if (this.isPlaying) return;
        
        this.isPlaying = true;
        this.updatePlayButton();
        
        if (this.useRealAudio) {
          // Real audio playback
          this.audio.play().catch(e => {
            console.error('Failed to play audio:', e);
            // Fallback to simulated if play fails
            this.useRealAudio = false;
            this.startSimulatedPlayback();
          });
        } else {
          // Simulated playback
          this.startSimulatedPlayback();
        }
      }
      
      // Start simulated playback (for episodes without real audio)
      startSimulatedPlayback() {
        // Update every 100ms for smooth progress at normal speed (1x)
        this.playInterval = setInterval(() => {
          this.currentTime += 0.1;
          
          if (this.currentTime >= this.duration) {
            this.currentTime = this.duration;
            this.updateUI();
            this.onEpisodeEnd();
          } else {
            this.updateUI();
          }
        }, 100);
      }
      
      // Pause playback
      pause() {
        if (!this.isPlaying) return;
        
        this.isPlaying = false;
        this.updatePlayButton();
        
        if (this.useRealAudio) {
          this.audio.pause();
        }
        
        if (this.playInterval) {
          clearInterval(this.playInterval);
          this.playInterval = null;
        }
      }
      
      // Toggle play/pause
      togglePlay() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }
      
      // Update play button icon
      updatePlayButton() {
        if (this.isPlaying) {
          // Show pause icon - centered
          this.playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          this.playIcon.style.transform = 'translateX(0) scale(1)';
        } else {
          // Show play icon - slight offset and scaled up
          this.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          this.playIcon.style.transform = 'translateX(0px) scale(1.2)';
        }
      }
      
      // Update progress bar and time display
      updateUI() {
        const percentage = this.duration > 0 ? (this.currentTime / this.duration) * 100 : 0;
        this.progressBar.value = percentage;
        updateProgressBar(this.progressBar);
        this.updateTimeDisplay();
      }
      
      updateTimeDisplay() {
        this.currentTimeEl.textContent = this.formatTime(this.currentTime);
        this.totalTimeEl.textContent = this.formatTime(this.duration);
      }
      
      // Called when episode ends
      onEpisodeEnd() {
        this.pause();
        this.currentTime = 0;
        
        // Auto-play next episode (playNext already handles auto-play)
        if (window.playerController) {
          window.playerController.playNext();
        }
      }
      
      // Reset for new episode (called by PlayerController)
      reset(episodeOrDuration) {
        this.loadEpisode(episodeOrDuration);
      }
    }
    
    // Initialize audio controller
    window.audioController = null;
    
    document.addEventListener('DOMContentLoaded', () => {
      window.audioController = new AudioController();
    });
  </script>

  <script>
    // Toast notification system
    function showToast(message, duration = 1200) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      
      if (toastMessage) toastMessage.textContent = message;
      
      toast.classList.add('visible');

  <script>
    // Prefetch audio durations for all episodes
    function prefetchDurations() {
      function formatDuration(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + secs.toString().padStart(2, '0');
      }

      function updateDurationInDOM(episode) {
        // Update feed items
        document.querySelectorAll(`.feed-item[data-id="${episode.id}"]`).forEach(feedItem => {
          const spans = feedItem.querySelectorAll('.text-xs.text-foreground-450 span');
          spans.forEach(span => {
            if (span.textContent === '...' || span.textContent === '--:--') {
              span.textContent = episode.duration;
            }
          });
        });
        // Update player if this is the current episode
        if (window.playerController && window.playerController.currentEpisode.id === episode.id) {
          const playerDuration = document.getElementById('playerDuration');
          if (playerDuration && (playerDuration.textContent === '...' || playerDuration.textContent === '--:--')) {
            playerDuration.textContent = episode.duration;
          }
          const miniCategory = document.getElementById('miniCategory');
          if (miniCategory && (miniCategory.textContent.includes('...') || miniCategory.textContent.includes('--:--'))) {
            miniCategory.textContent = episode.category + ' \u2022 ' + episode.duration;
          }
          const totalTime = document.getElementById('totalTime');
          if (totalTime && (totalTime.textContent === '--:--' || totalTime.textContent === '...')) {
            totalTime.textContent = episode.duration;
          }
        }
      }

      // Load one episode duration at a time (sequential) to avoid connection limits
      let index = 0;
      function loadNext() {
        if (index >= PODCAST_PLAYLIST.length) return;
        const episode = PODCAST_PLAYLIST[index];
        index++;

        if (episode.duration && episode.duration !== '...' && episode.duration !== '--:--') {
          updateDurationInDOM(episode);
          setTimeout(loadNext, 50);
          return;
        }

        const audio = new Audio();
        audio.preload = 'metadata';
        let resolved = false;

        const timer = setTimeout(() => {
          if (resolved) return;
          resolved = true;
          audio.src = '';
          // Don't mark as --:-- yet, will retry
          setTimeout(loadNext, 100);
        }, 15000);

        audio.addEventListener('loadedmetadata', () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timer);
          if (audio.duration && isFinite(audio.duration)) {
            episode.duration = formatDuration(audio.duration);
            updateDurationInDOM(episode);
          }
          audio.src = '';
          setTimeout(loadNext, 50);
        });
        audio.addEventListener('error', () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timer);
          episode.duration = '--:--';
          audio.src = '';
          setTimeout(loadNext, 100);
        });
        audio.src = episode.audioSrc;
      }

      // Run two sequential chains in parallel for faster loading
      const halfway = Math.ceil(PODCAST_PLAYLIST.length / 2);
      let index2 = halfway;
      function loadNext2() {
        if (index2 >= PODCAST_PLAYLIST.length) return;
        const episode = PODCAST_PLAYLIST[index2];
        index2++;

        if (episode.duration && episode.duration !== '...' && episode.duration !== '--:--') {
          updateDurationInDOM(episode);
          setTimeout(loadNext2, 50);
          return;
        }

        const audio = new Audio();
        audio.preload = 'metadata';
        let resolved = false;

        const timer = setTimeout(() => {
          if (resolved) return;
          resolved = true;
          audio.src = '';
          setTimeout(loadNext2, 100);
        }, 15000);

        audio.addEventListener('loadedmetadata', () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timer);
          if (audio.duration && isFinite(audio.duration)) {
            episode.duration = formatDuration(audio.duration);
            updateDurationInDOM(episode);
          }
          audio.src = '';
          setTimeout(loadNext2, 50);
        });
        audio.addEventListener('error', () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timer);
          episode.duration = '--:--';
          audio.src = '';
          setTimeout(loadNext2, 100);
        });
        audio.src = episode.audioSrc;
      }

      loadNext();
      setTimeout(loadNext2, 200);
    }

    // Start prefetching after data and DOM are ready
    document.addEventListener('DOMContentLoaded', () => {
      podcastDataReady.then(() => {
        // Slight delay to let the UI render first
        setTimeout(prefetchDurations, 500);
      });
    });
  </script>

</body>
</html>
